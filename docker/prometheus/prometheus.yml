global:
  scrape_interval: 15s

scrape_configs:
  - job_name: atlas-api
    metrics_path: /metrics
    static_configs:
      - targets: ["atlas-api:9090"]
  - job_name: atlas-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["atlas-worker:9090"]
  - job_name: atlas-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["atlas-scheduler:9090"]
