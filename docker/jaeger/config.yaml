# Development-only in-memory tracing backend; use durable storage in production.
extensions:
  jaeger_storage:
    backends:
      atlas:
        memory:
          max_traces: 10000
  jaeger_query:
    storage:
      traces: atlas
    http:
      endpoint: 0.0.0.0:16686
receivers:
  otlp:
    protocols:
      # Jaeger's own telemetry defaults to local OTLP/gRPC. Keep it internal.
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 500ms
exporters:
  jaeger_storage_exporter:
    trace_storage: atlas
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
