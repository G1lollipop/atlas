services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    command:
      - postgres
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - baseline-postgres:/var/lib/postgresql/data

  api:
    image: ${COMPOSE_PROJECT_NAME:-atlas-baseline}-api
    build:
      context: ${SOURCE_ROOT:-..}
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-baseline-local-secret-change-me}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
      RATE_LIMIT_RPS: "1000"
      RATE_LIMIT_BURST: "2000"
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::9090"

  worker-one:
    image: ${COMPOSE_PROJECT_NAME:-atlas-baseline}-worker
    build:
      context: ${SOURCE_ROOT:-..}
      dockerfile: docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-baseline-local-secret-change-me}
      METRICS_ADDR: :9090
      WORKER_ID: baseline-worker-one
      WORKER_CONCURRENCY: "1"
      LEASE_DURATION: 6s
      POLL_INTERVAL: 100ms
    ports:
      - "127.0.0.1::9090"

  worker-two:
    image: ${COMPOSE_PROJECT_NAME:-atlas-baseline}-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-baseline-local-secret-change-me}
      METRICS_ADDR: :9090
      WORKER_ID: baseline-worker-two
      WORKER_CONCURRENCY: "1"
      LEASE_DURATION: 6s
      POLL_INTERVAL: 100ms
    ports:
      - "127.0.0.1::9090"

  scheduler-one:
    image: ${COMPOSE_PROJECT_NAME:-atlas-baseline}-scheduler
    build:
      context: ${SOURCE_ROOT:-..}
      dockerfile: docker/Dockerfile.scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-baseline-local-secret-change-me}
      METRICS_ADDR: :9090
      POLL_INTERVAL: 100ms
    ports:
      - "127.0.0.1::9090"

  scheduler-two:
    image: ${COMPOSE_PROJECT_NAME:-atlas-baseline}-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-baseline-local-secret-change-me}
      METRICS_ADDR: :9090
      POLL_INTERVAL: 100ms
    ports:
      - "127.0.0.1::9090"

volumes:
  baseline-postgres:
