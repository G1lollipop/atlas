apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-scheduler
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: scheduler
spec:
  # Safe to run at 2 replicas because the scheduler uses leader election - only
  # the elected leader promotes, the rest sit as standbys. No HPA here: promotion
  # throughput isn't the bottleneck this scales.
  replicas: 2
  selector:
    matchLabels:
      app: atlas-scheduler
  template:
    metadata:
      labels:
        app: atlas-scheduler
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          # Real deploys should reference a registry-qualified image (e.g.
          # <account>.dkr.ecr.<region>.amazonaws.com/atlas-scheduler:<tag>), not :latest.
          image: atlas-scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: atlas-config
            - secretRef:
                name: atlas-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-scheduler-metrics
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app: atlas-scheduler
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
