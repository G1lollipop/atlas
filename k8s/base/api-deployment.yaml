apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Real deploys should reference a registry-qualified image (e.g.
          # <account>.dkr.ecr.<region>.amazonaws.com/atlas-api:<tag>), not :latest.
          image: atlas-api:latest
          # IfNotPresent (not the default Always) so a locally-built/pre-loaded image
          # (kind load docker-image, or an immutable digest-pinned tag in prod) is used
          # as-is instead of the kubelet always attempting a registry pull.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: atlas-config
            - secretRef:
                name: atlas-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: atlas-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
