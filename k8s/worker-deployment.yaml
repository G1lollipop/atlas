apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-worker
  template:
    metadata:
      labels:
        app: atlas-worker
    spec:
      containers:
        - name: worker
          # Real deploys should reference a registry-qualified image (e.g.
          # <account>.dkr.ecr.<region>.amazonaws.com/atlas-worker:<tag>), not :latest.
          image: atlas-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: atlas-config
            - secretRef:
                name: atlas-secrets
          env:
            # Advertised capacity matches the container limits below. CPU is
            # millicores; memory and GPU memory are MB.
            - name: WORKER_CPU_CAPACITY_MILLIS
              value: "500"
            - name: WORKER_MEMORY_CAPACITY_MB
              value: "256"
            - name: WORKER_GPU_COUNT
              value: "0"
            - name: WORKER_GPU_TYPE
              value: ""
            - name: WORKER_GPU_MEMORY_MB
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
